name: E5 Manifest Security

on:
  pull_request:
    paths:
      - "security/**"
      - "server/*secret*.yaml"
      - "**/*deployment*.yaml"
      - "**/*service*.yaml"
      - "tests/e5_manifest_security_guard.py"
      - ".github/workflows/e5-manifest-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-security:
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned YAML parser
        run: python -m pip install PyYAML==6.0.2

      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Run manifest security guard
        run: python tests/e5_manifest_security_guard.py
